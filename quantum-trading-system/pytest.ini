[pytest]
# Pytest Configuration for Quantum Trading System
# Test Suite Specialist (Agent 28)

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Minimum Python version
minversion = 7.4

# Add current directory to Python path
pythonpath = . src

# Output options
addopts =
    # Verbosity
    -v
    --tb=short
    --strict-markers
    --strict-config

    # Coverage options (can be overridden by command line)
    --cov=src
    --cov-branch
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-report=json:coverage.json
    --cov-fail-under=90

    # Output formats
    --junitxml=tests/junit.xml
    --json-report
    --json-report-file=tests/test_report.json
    --json-report-indent=2

    # Performance and output
    --maxfail=5
    --durations=10
    --color=yes

    # Warnings
    -W ignore::DeprecationWarning
    -W ignore::PendingDeprecationWarning

    # Show local variables in tracebacks
    --showlocals

# Markers for test categorization
markers =
    unit: Unit tests for individual components
    integration: Integration tests across components
    e2e: End-to-end tests
    slow: Tests that take significant time
    oeis: OEIS sequence validation tests
    integer_validation: Integer-only arithmetic validation
    fibonacci: Fibonacci sequence related tests
    lucas: Lucas sequence related tests
    zeckendorf: Zeckendorf representation tests
    neural: Neural network and QFNN tests
    pricing: Options pricing and financial tests
    strategy: Trading strategy tests
    backtest: Backtesting engine tests
    data: Data fetching and validation tests
    visualization: Charting and visualization tests
    performance: Performance and benchmark tests
    smoke: Quick smoke tests for CI
    regression: Regression tests

# Coverage configuration
[coverage:run]
source = src
branch = True
omit =
    */tests/*
    */test_*.py
    */__pycache__/*
    */venv/*
    */env/*
    */examples/*
    */docs/*
    */team-outputs/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
sort = Cover
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
    @abc.abstractmethod
    pass

[coverage:html]
directory = htmlcov
title = Quantum Trading System - Test Coverage Report

[coverage:json]
output = coverage.json
pretty_print = True
show_contexts = True
